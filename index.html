<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>צמיגיית המקצוענים</title>
    <style>
        body { font-family: -apple-system, sans-serif; margin: 0; background-color: #f4f4f4; text-align: center; }
        header { background: #222; color: #ffcc00; padding: 20px; border-bottom: 3px solid #ffcc00; }
        .card { background: white; margin: 15px; padding: 25px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        input { width: 100%; padding: 15px; font-size: 22px; border: 2px solid #ddd; border-radius: 10px; margin-bottom: 15px; text-align: center; box-sizing: border-box; }
        button { background: #ffcc00; border: none; padding: 18px; width: 100%; font-size: 20px; font-weight: bold; border-radius: 10px; cursor: pointer; color: #222; }
        #res { margin-top: 20px; text-align: right; display: none; line-height: 1.8; font-size: 19px; background: #fff9e6; padding: 15px; border-radius: 10px; border-right: 5px solid #ffcc00; }
        .loader { display: none; margin: 15px auto; border: 5px solid #f3f3f3; border-top: 5px solid #ffcc00; border-radius: 50%; width: 40px; height: 40px; animation: spin 0.8s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <header><h1>צמיגיית המקצוענים 🚗</h1></header>
    <div class="card">
        <input type="tel" id="carNum" placeholder="הכנס מספר רכב">
        <button onclick="checkCar()">בדוק פרטי רכב</button>
        <div id="loader" class="loader"></div>
        <div id="res"></div>
    </div>

<script>
async function checkCar() {
    const num = document.getElementById('carNum').value.trim();
    const res = document.getElementById('res');
    const loader = document.getElementById('loader');
    
    if(!num) return;

    // איפוס תצוגה
    res.style.display = 'none';
    res.innerHTML = '';
    loader.style.display = 'block';

    try {
        // כתובת המאגר הממשלתי
        const govUrl = `https://data.gov.il/api/3/action/datastore_search?resource_id=053ad243-11e8-4242-ac28-58a74acad3b3&q=${num}`;
        
        // שימוש בפרוקסי מהיר שעוקף חסימות - CorsProxy.io
        const proxyUrl = `https://corsproxy.io/?${encodeURIComponent(govUrl)}`;
        
        const response = await fetch(proxyUrl);
        
        if (!response.ok) {
            throw new Error('Network response was not ok');
        }

        const data = await response.json();
        
        // בדיקה אם נמצאו רכבים וסינון התוצאה המדויקת
        let car = null;
        if (data.result.records.length > 0) {
            car = data.result.records.find(r => String(r.mispar_rechev) === num);
        }

        if (car) {
            res.innerHTML = `
                <div style="text-align:center; font-weight:bold; color:#d35400; margin-bottom:10px;">✅ נמצא רכב במאגר</div>
                <strong>🚗 דגם:</strong> ${car.tozeret_nm} ${car.kinuy_mishari || ''}<br>
                <strong>📅 שנה:</strong> ${car.shnat_yitzur}<br>
                <strong>📏 צמיג קדמי:</strong> ${car.zmig_kidmi || 'לא רשום'}<br>
                <strong>📏 צמיג אחורי:</strong> ${car.zmig_ahori || 'לא רשום'}<br>
                <strong>⏳ טסט עד:</strong> <span style="color:red; font-weight:bold;">${car.mivchan_acharon_dt ? car.mivchan_acharon_dt.split('T')[0] : 'לא ידוע'}</span>
            `;
            res.style.display = 'block';
        } else {
            res.innerHTML = '❌ מספר הרכב לא נמצא במאגר (בדוק שהמספר תקין).';
            res.style.display = 'block';
        }
    } catch (error) {
        console.error(error);
        res.innerHTML = '⚠️ שגיאת תקשורת. נסה לרענן את הדף ולבדוק שוב.';
        res.style.display = 'block';
    } finally {
        loader.style.display = 'none';
    }
}
</script>
</body>
</html>
