<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>צמיגיית המקצוענים - חיפוש רכב</title>
    <link rel="manifest" href="manifest.json">
    <style>
        body { font-family: -apple-system, sans-serif; margin: 0; padding: 0; background-color: #f0f2f5; text-align: center; }
        header { background-color: #222; color: #ffcc00; padding: 20px; box-shadow: 0 2px 5px rgba(0,0,0,0.2); }
        .container { padding: 20px; max-width: 500px; margin: auto; }
        .search-card { background: white; padding: 25px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        input { width: 100%; padding: 15px; font-size: 20px; border: 2px solid #ddd; border-radius: 10px; text-align: center; box-sizing: border-box; margin-bottom: 15px; }
        .search-btn { background-color: #ffcc00; color: #222; border: none; padding: 15px; font-weight: bold; border-radius: 10px; cursor: pointer; width: 100%; font-size: 18px; }
        #result { margin-top: 20px; text-align: right; display: none; background: #f9f9f9; padding: 15px; border-radius: 10px; border-right: 5px solid #ffcc00; line-height: 1.6; }
        .loader { display: none; border: 4px solid #f3f3f3; border-top: 4px solid #ffcc00; border-radius: 50%; width: 30px; height: 30px; animation: spin 1s linear infinite; margin: 15px auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .footer-btns { display: flex; gap: 10px; margin-top: 20px; }
        .btn { flex: 1; padding: 15px; border-radius: 10px; text-decoration: none; color: white; font-weight: bold; }
        .call { background-color: #28a745; }
        .waze { background-color: #007bff; }
    </style>
</head>
<body>

<header>
    <h1>צמיגיית המקצוענים 🚗</h1>
</header>

<div class="container">
    <div class="search-card">
        <input type="tel" id="carNumber" placeholder="מספר רכב (7 או 8 ספרות)">
        <button class="search-btn" onclick="searchCar()">בדוק פרטי רכב וצמיגים</button>
        <div id="loader" class="loader"></div>
        <div id="result"></div>
    </div>

    <div class="footer-btns">
        <a href="tel:0501234567" class="btn call">📞 התקשר</a>
        <a href="https://waze.com/ul?q=הרימון_1_אבן_יהודה" class="btn waze">📍 ניווט</a>
    </div>
</div>

<script>
async function searchCar() {
    const carNum = document.getElementById('carNumber').value.trim();
    const resultDiv = document.getElementById('result');
    const loader = document.getElementById('loader');
    
    if (!carNum) return;

    resultDiv.style.display = 'none';
    loader.style.display = 'block';

    try {
        // שימוש ב-API של משרד התחבורה
        const url = `https://data.gov.il/api/3/action/datastore_search?resource_id=053ad243-11e8-4242-ac28-58a74acad3b3&q=${carNum}`;
        const response = await fetch(url);
        const data = await response.json();
        
        const car = data.result.records.find(r => String(r.mispar_rechev) === carNum);
        
        if (car) {
            // עיבוד תאריך הטסט למבנה קריא
            let testDate = car.mivchan_acharon_dt ? car.mivchan_acharon_dt.split('T')[0] : 'לא ידוע';
            
            resultDiv.innerHTML = `
                <div style="font-size: 18px; border-bottom: 1px solid #ddd; padding-bottom: 5px; margin-bottom: 10px;"><strong>פרטי רכב:</strong></div>
                <strong>🚗 דגם:</strong> ${car.tozeret_nm} ${car.kinuy_mishari}<br>
                <strong>📅 שנה:</strong> ${car.shnat_yitzur}<br>
                <strong>🛠️ צמיג קדמי:</strong> ${car.zmig_kidmi || 'לא רשום'}<br>
                <strong>🛠️ צמיג אחורי:</strong> ${car.zmig_ahori || 'לא רשום'}<br>
                <strong>⏳ טסט עד:</strong> <span style="color: red;">${testDate}</span>
            `;
            resultDiv.style.display = 'block';
        } else {
            resultDiv.innerHTML = '❌ הרכב לא נמצא במאגר.';
            resultDiv.style.display = 'block';
        }
    } catch (error) {
        resultDiv.innerHTML = '⚠️ תקלה בחיבור למאגר הממשלתי. נסה שוב בעוד רגע.';
        resultDiv.style.display = 'block';
    } finally {
        loader.style.display = 'none';
    }
}
</script>

</body>
</html>
