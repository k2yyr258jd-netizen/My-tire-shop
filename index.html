<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>צמיגיית המקצוענים</title>
    <style>
        body { font-family: -apple-system, sans-serif; margin: 0; background-color: #f4f4f4; text-align: center; }
        header { background: #222; color: #ffcc00; padding: 20px; }
        .card { background: white; margin: 15px; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        input { width: 90%; padding: 15px; font-size: 20px; border: 2px solid #ddd; border-radius: 8px; margin-bottom: 10px; text-align: center; }
        button { background: #ffcc00; border: none; padding: 15px; width: 90%; font-size: 18px; font-weight: bold; border-radius: 8px; cursor: pointer; }
        #res { margin-top: 20px; text-align: right; display: none; line-height: 1.8; font-size: 18px; border-top: 2px solid #eee; padding-top: 15px; }
        .loader { display: none; margin: 10px auto; border: 4px solid #f3f3f3; border-top: 4px solid #ffcc00; border-radius: 50%; width: 30px; height: 30px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <header><h1>צמיגיית המקצוענים 🚗</h1></header>
    <div class="card">
        <input type="tel" id="carNum" placeholder="הכנס מספר רכב">
        <button onclick="checkCar()">בדוק פרטי רכב</button>
        <div id="loader" class="loader"></div>
        <div id="res"></div>
    </div>

<script>
async function checkCar() {
    const num = document.getElementById('carNum').value;
    const res = document.getElementById('res');
    const loader = document.getElementById('loader');
    if(!num) return;

    res.style.display = 'none';
    loader.style.display = 'block';

    try {
        // שימוש בכתובת ה-API הרשמית עם חיפוש חופשי
        const response = await fetch(`https://data.gov.il/api/3/action/datastore_search?resource_id=053ad243-11e8-4242-ac28-58a74acad3b3&q=${num}`);
        const data = await response.json();
        const car = data.result.records[0];

        if (car) {
            res.innerHTML = `
                <strong>🚗 רכב:</strong> ${car.tozeret_nm} ${car.kinuy_mishari}<br>
                <strong>📅 שנה:</strong> ${car.shnat_yitzur}<br>
                <strong>📏 צמיג קדמי:</strong> ${car.zmig_kidmi}<br>
                <strong>📏 צמיג אחורי:</strong> ${car.zmig_ahori}<br>
                <strong>⏳ טסט עד:</strong> ${car.mivchan_acharon_dt ? car.mivchan_acharon_dt.split('T')[0] : 'לא ידוע'}
            `;
            res.style.display = 'block';
        } else {
            res.innerHTML = '❌ הרכב לא נמצא במאגר הממשלתי.';
            res.style.display = 'block';
        }
    } catch (e) {
        res.innerHTML = '⚠️ שגיאה זמנית בחיבור. נסה שוב.';
        res.style.display = 'block';
    } finally {
        loader.style.display = 'none';
    }
}
</script>
</body>
</html>
