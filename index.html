<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>צמיגיית המקצוענים</title>
    <style>
        body { font-family: -apple-system, system-ui, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 0; background-color: #f8f9fa; text-align: center; color: #333; }
        header { background: #212529; color: #ffc107; padding: 20px 0; box-shadow: 0 4px 6px rgba(0,0,0,0.1); margin-bottom: 25px; }
        h1 { margin: 0; font-size: 24px; font-weight: 800; }
        .container { padding: 0 20px; max-width: 500px; margin: 0 auto; }
        
        .card { background: white; padding: 25px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); }
        
        input { width: 100%; padding: 16px; font-size: 22px; border: 2px solid #dee2e6; border-radius: 12px; margin-bottom: 15px; text-align: center; box-sizing: border-box; background: #f8f9fa; font-weight: bold; outline: none; transition: border-color 0.3s; }
        input:focus { border-color: #ffc107; background: #fff; }
        
        button.search-btn { background: #ffc107; border: none; padding: 16px; width: 100%; font-size: 20px; font-weight: 800; border-radius: 12px; cursor: pointer; color: #212529; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }

        #res { display: none; margin-top: 20px; text-align: right; background: #fff; border-radius: 12px; border: 1px solid #e9ecef; overflow: hidden; }
        
        .res-header { background: #e9ecef; color: #495057; padding: 10px; text-align: center; font-weight: bold; }
        .res-body { padding: 15px; font-size: 17px; line-height: 1.6; }
        .res-row { display: flex; justify-content: space-between; border-bottom: 1px solid #f1f3f5; padding: 8px 0; }
        .label { font-weight: 600; color: #868e96; }
        .value { font-weight: 800; color: #212529; }
        
        .actions { display: flex; gap: 10px; margin-top: 20px; }
        .action-btn { flex: 1; padding: 15px; border-radius: 12px; font-weight: bold; font-size: 18px; border: none; cursor: pointer; color: white; text-decoration: none; display: flex; align-items: center; justify-content: center; }
        .waze { background: #3498db; }
        .call { background: #2ecc71; }

        .loader { display: none; margin: 15px auto; border: 4px solid #f3f3f3; border-top: 4px solid #ffc107; border-radius: 50%; width: 35px; height: 35px; animation: spin 0.8s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        
        #debug { font-size: 10px; color: #ccc; margin-top: 30px; }
    </style>
</head>
<body>
    <header><h1>צמיגיית המקצוענים 🚗</h1></header>
    
    <div class="container">
        <div class="card">
            <input type="tel" id="carNum" placeholder="הכנס מספר רכב" autocomplete="off">
            <button class="search-btn" onclick="checkCar()">חפש רכב</button>
            
            <div id="loader" class="loader"></div>
            <div id="res"></div>
        </div>

        <div class="actions">
            <a href="https://waze.com/ul?q=צמיגיית המקצוענים" class="action-btn waze">📍 ניווט</a>
            <a href="tel:0500000000" class="action-btn call">📞 חייג</a>
        </div>
        
        <div id="debug"></div>
    </div>

<script>
async function checkCar() {
    // 1. ניקוי הקלט - השארת ספרות בלבד
    let num = document.getElementById('carNum').value.replace(/\D/g, '');
    const res = document.getElementById('res');
    const loader = document.getElementById('loader');
    const debug = document.getElementById('debug');
    
    if(!num || num.length < 5) {
        alert("נא להזין מספר רכב תקין (ספרות בלבד)");
        return;
    }

    res.style.display = 'none';
    debug.innerText = '';
    loader.style.display = 'block';

    // הגדרות ה-API
    const resourceId = '053ad243-11e8-4242-ac28-58a74acad3b3';
    // שימוש בפילטר מדויק למניעת עומס
    const govUrl = `https://data.gov.il/api/3/action/datastore_search?resource_id=${resourceId}&filters={"mispar_rechev":"${num}"}`;
    const proxyUrl = `https://api.allorigins.win/get?url=${encodeURIComponent(govUrl)}&timestamp=${new Date().getTime()}`;

    try {
        const response = await fetch(proxyUrl);
        if (!response.ok) throw new Error('Network response was not ok');
        
        const wrapperData = await response.json();
        const realData = JSON.parse(wrapperData.contents);

        if (realData.result && realData.result.records && realData.result.records.length > 0) {
            const car = realData.result.records[0];
            const testDate = car.mivchan_acharon_dt ? new Date(car.mivchan_acharon_dt).toLocaleDateString('he-IL') : 'לא ידוע';
            
            res.innerHTML = `
                <div class="res-header">✅ נמצאו פרטים למספר ${num}</div>
                <div class="res-body">
                    <div class="res-row"><span class="label">דגם:</span> <span class="value">${car.tozeret_nm}</span></div>
                    <div class="res-row"><span class="label">שנה:</span> <span class="value">${car.shnat_yitzur}</span></div>
                    <div class="res-row"><span class="label">מידת צמיג:</span> <span class="value">${car.zmig_kidmi || 'לא רשום'}</span></div>
                    <div class="res-row"><span class="label">טסט עד:</span> <span class="value" style="color:#d63031">${testDate}</span></div>
                </div>
            `;
            res.style.display = 'block';
        } else {
            res.innerHTML = '<div style="padding:15px; color:#c0392b; font-weight:bold;">❌ הרכב לא נמצא במאגר</div>';
            res.style.display = 'block';
        }

    } catch (error) {
        console.error("Detailed error:", error);
        res.innerHTML = '<div style="padding:15px; color:#e67e22; font-weight:bold;">⚠️ תקלה בחיבור לשרת הממשלתי. נסה שוב בעוד רגע.</div>';
        res.style.display = 'block';
        debug.innerText = 'שגיאה: ' + error.message;
    } finally {
        loader.style.display = 'none';
    }
}
</script>
</body>
</html>
